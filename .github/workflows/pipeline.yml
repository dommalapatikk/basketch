name: Deal Pipeline

on:
  schedule:
    # Monday 05:00 UTC (07:00 Swiss) — Aldi Mon cycle, Volg general
    - cron: '0 5 * * 1'
    # Tuesday 05:00 UTC (07:00 Swiss) — Spar
    - cron: '0 5 * * 2'
    # Thursday 05:00 UTC (07:00 Swiss) — Migros, Coop, Lidl, Denner, Aldi Thu, Volg fresh
    - cron: '0 5 * * 4'
  # ⚠️ Runs every store regardless of its day-of-week schedule — a full
  # re-collection, not a targeted retry. The 2026-09-15 RCA's working rule
  # ("no dispatch-driven debugging" until WP-J3's fetch ledger lands) exists
  # because dispatch runs caused 15 of the 25 full collections between 11 and
  # 14 September. Prefer re-reading a failed run's log over dispatching a new
  # one while that rule stands.
  workflow_dispatch:
    inputs:
      collection_mode:
        description: 'Collection mode for THIS run only (blank = use the COLLECTION_MODE repo variable)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'off'
          - 'shadow'
          - 'live'

# WP-P3: never let two runs of this workflow write concurrently — a second
# scheduled or dispatched run while one is still in flight queues behind it
# instead of racing it. `cancel-in-progress: false` because a queued run
# fetching FRESH data is not equivalent to a cancelled one losing an
# in-progress collection.
concurrency:
  group: deal-pipeline
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # THE CUTOVER SWITCH. off | shadow | live — see
  # pipeline/collection/application/collection-mode.ts.
  #
  # ⚠️ This line is why setting the repo variable does anything at all. Until
  # 2026-09-11 the variable existed in the code and was never passed to the
  # process, so readCollectionMode() saw undefined, defaulted to 'off', and a
  # run with COLLECTION_MODE=live set would have reported a clean success while
  # collecting from none of the seven retailers.
  #
  # A workflow_dispatch input overrides the variable for one run, so a shadow
  # run can be taken without changing repo settings and without leaving the
  # switch flipped afterwards.
  COLLECTION_MODE: ${{ inputs.collection_mode || vars.COLLECTION_MODE || 'off' }}

jobs:
  fetch-deals:
    name: Fetch ${{ matrix.label }} Deals
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: coop
            store: coop
            label: Coop
            # Thu launch (Thu–Wed). Also try Mon/Tue in case aktionis catches stragglers.
            days: '1,2,4'
          - slug: coop-megastore
            store: coop
            label: Coop Megastore
            days: '1,2,4'
          - slug: migros
            store: migros
            label: Migros
            # Thu launch (Thu–Wed)
            days: '4'
          - slug: lidl
            store: lidl
            label: LIDL
            # Thu launch (Thu–Wed)
            days: '4'
          - slug: aldi-suisse
            store: aldi
            label: ALDI
            # Mon + Thu dual cycle
            days: '1,4'
          - slug: denner
            store: denner
            label: Denner
            # Thu launch (Thu–Wed)
            days: '4'
          - slug: spar
            store: spar
            label: SPAR
            # Tue launch (Tue–Mon)
            days: '2'
          - slug: volg
            store: volg
            label: Volg
            # Mon (general) + Thu (fresh)
            days: '1,4'
    steps:
      - name: Check if store runs today
        id: should-run
        run: |
          DOW=$(date -u +%u)
          DAYS="${{ matrix.days }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || echo "$DAYS" | grep -q "$DOW"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.label }} — not scheduled for day $DOW"
          fi

      - uses: actions/checkout@v4
        if: steps.should-run.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.should-run.outputs.run == 'true'
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        run: pip install -r pipeline/aktionis/requirements.txt

      - name: Fetch ${{ matrix.label }} deals (with retry)
        if: steps.should-run.outputs.run == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 300
          command: cd pipeline/aktionis && python3 main.py ${{ matrix.slug }} ${{ matrix.store }} ${{ matrix.slug }}-deals.json

      - name: Upload deals artifact
        if: always() && steps.should-run.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-deals
          path: pipeline/aktionis/${{ matrix.slug }}-deals.json
          retention-days: 7
          if-no-files-found: ignore

  process-and-store:
    name: Categorize & Store Deals
    runs-on: ubuntu-latest
    needs: [fetch-deals]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install dependencies
        run: cd pipeline && npm ci

      # REQUIRED by collection/infrastructure/pdf/pdf-words.ts, which shells out
      # to `pdftotext -bbox` for the Spar and Aldi flyers.
      #
      # This is present on macOS via Homebrew and absent on a GitHub runner, so
      # the PDF path works locally and fails only in CI — the failure mode local
      # testing cannot find. Verified 2026-09-10 against the live KW37 flyers:
      # Spar 17 pages / 2,047 words, Aldi 40 pages / 5,718 words.
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Verify pdftotext is callable
        run: pdftotext -v

      # Migros is the one retailer whose flyer has no text layer — it is page
      # images, so reading it means OCR. run.ts shells out to ocr.py, which needs
      # these. Without them the Migros source fails with "rapidocr-onnxruntime
      # not installed" while every other retailer succeeds.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Migros OCR dependencies
        run: pip install -q -r pipeline/collection/infrastructure/migros/requirements.txt

      - name: Verify the OCR runtime imports
        run: python3 -c "import rapidocr_onnxruntime, PIL, numpy; print('OCR runtime ok')"

      - name: Download all deal artifacts
        uses: actions/download-artifact@v4
        with:
          path: pipeline/
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la pipeline/*-deals.json 2>/dev/null || echo "No deal files found"

      - name: Categorize and store (with retry)
        uses: nick-fields/retry@v3
        env:
          WEB_REVALIDATE_URL: ${{ secrets.WEB_REVALIDATE_URL }}
          WEB_REVALIDATE_SECRET: ${{ secrets.WEB_REVALIDATE_SECRET }}
          # Classification model (tier 1). Free tier: 1,000 requests/day, and a
          # batched run needs ~72. Without this the run still completes — every
          # product is marked uncertain rather than mis-labelled — but nothing
          # gets a category.
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          # Judge (tier 2), wired since composition.ts#buildClassificationDeps:
          # every classification is escalated to it when this key is present
          # (`createOpenRouterJudge`). Absent, classification still runs —
          # judged verdicts are simply never requested, tracked as
          # `stats.judgeUnavailable`.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Correlation ID, so a classification row in Supabase links back to
          # the job log that produced it.
          GITHUB_RUN_ID: ${{ github.run_id }}
          # AP-5: the out-of-band dead-man's switch (healthchecks.io). Absent,
          # `pingHealthcheck` logs a warning and never fails the run — see
          # `observability/healthcheck-ping.ts`.
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        with:
          # Retries are SAFE and CHEAP here: every classification is written to
          # the cache as it completes, so attempt 2 re-reads what attempt 1
          # already paid for. Quota is not spent twice on the same product.
          #
          # ⚠️ That was ASPIRATIONAL until 2026-09-11 — the cache was written
          # once, after the whole graph finished, so a run killed by the timeout
          # persisted nothing and every attempt restarted from zero. Both live
          # cutover attempts showed `cache: 0/1650 hits` on all three tries.
          # classify-deals.ts now persists per chunk, which makes the paragraph
          # above true. Do not go back to a single end-of-run save.
          #
          # WP-P3 (RCA T1): 45 is now a HANG BACKSTOP ONLY, not the mechanism
          # that recovers a slow cold start. `run.ts` exits on its own —
          # `RUN_DEADLINE_MS` (35 min, `transformation/domain/resilience.ts`,
          # guarded by `config.test.ts`) — well before this line is ever
          # reached, so `retry_on_exit_code: 75` below can actually retry it.
          # A run that instead hits THIS external timeout is killed by SIGTERM
          # and is NOT retried (verified against nick-fields/retry's own
          # source, index.ts:91-120,147: a SIGTERM'd child never sets its own
          # exit code, so `exit` stays 0 and never matches 75) — that case is
          # meant to stay rare, a genuine hang, not the normal cold-start path.
          timeout_minutes: 45
          # 2 not 3: each attempt now RESUMES, so a third is rarely useful and
          # a runaway costs 90 minutes rather than 135.
          max_attempts: 2
          # WP-P3 (RCA T1): only retry EX_TEMPFAIL (75) — the code `run.ts`
          # uses for a transient failure (the in-process deadline, or an
          # unreadable classification cache/Supabase). A deterministic
          # failure, a bug, or a critical alert exits 1 and is deliberately
          # NOT retried. Attempt 2 runs `new_command_on_retry`, which flags
          # itself as the final attempt so `run.ts` publishes what it has
          # rather than deferring again.
          retry_on_exit_code: 75
          new_command_on_retry: cd pipeline && PIPELINE_FINAL_ATTEMPT=1 npx tsx run.ts
          # 60 not 300: attempt 1 already spent its own 35 minutes
          # (RUN_DEADLINE_MS) before exiting 75, so there is nothing left to
          # wait out — a long pause here only pushes publishing later.
          retry_wait_seconds: 60
          command: cd pipeline && npx tsx run.ts

  keep-alive:
    name: Supabase Keep-Alive
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/rpc/select_1" \
            -X POST \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "204" ]; then
            echo "Keep-alive ping OK (HTTP $STATUS)"
          else
            FALLBACK=$(curl -s -o /dev/null -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
            echo "Keep-alive fallback ping (HTTP $FALLBACK)"
          fi
