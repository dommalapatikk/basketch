name: CI

on:
  push:
    # feat/** added 2026-09-11: components 1-4 were built across three pushes
    # to feat/collection-module and CI ran on none of them, because only main
    # and redesign were listed. Every number in those handoffs was local.
    branches: [main, redesign, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check (pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install pipeline dependencies
        run: cd pipeline && npm ci

      - name: Type-check pipeline
        run: cd pipeline && npx tsc --noEmit

  # `shared/` has its own package.json and its own vitest suite, and until now
  # no CI job ran it. That is how 12 tests sat failing unnoticed — the suite
  # every other job depends on for its types was the one nobody checked.
  #
  # It has no dependencies of its own, so vitest is borrowed from pipeline's
  # node_modules rather than installing a third toolchain for one suite.
  #
  # Three tests in category-rules.test.ts are `it.fails` on purpose: they pass
  # while the old keyword matcher is broken and go RED when it is fixed or
  # deleted (decision D4). A red result here means that cleanup landed.
  test-shared:
    name: Test (shared types + taxonomy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install pipeline dependencies (provides vitest)
        run: cd pipeline && npm ci

      # Coverage (SonarQube): vitest resolves @vitest/coverage-v8 from the
      # --root folder upwards, so shared/ needs a node_modules to find it. The
      # symlink points at pipeline's (gitignored; the runner is thrown away).
      - name: Test shared (with coverage)
        run: |
          ln -sfn ../pipeline/node_modules node_modules
          ./node_modules/.bin/vitest run --root . --coverage \
            --coverage.reporter=lcov --coverage.reporter=text-summary \
            --coverage.reportOnFailure=true
        working-directory: shared

      - name: Upload coverage (shared)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shared
          path: shared/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  test-typescript:
    name: Test (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install pipeline dependencies
        run: cd pipeline && npm ci

      - name: Test pipeline (with coverage)
        run: cd pipeline && npm run test:coverage

      - name: Upload coverage (pipeline)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pipeline
          path: pipeline/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # web-next/ — the v2.1 Next.js 16 build that lives at basketch.vercel.app.
  # Five jobs per v2.1 §G: lint+typecheck, vitest, build, playwright, axe (inside playwright).
  # ---------------------------------------------------------------------------
  lint-and-typecheck-web-next:
    name: web-next · Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Install
        run: cd web-next && npm ci
      - name: Type-check
        run: cd web-next && npx tsc --noEmit
      - name: Lint (Biome)
        run: cd web-next && npx biome check . || true   # warn-only until lint debt is paid down

  test-web-next:
    name: web-next · Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Install
        run: cd web-next && npm ci
      - name: Vitest (with coverage)
        run: cd web-next && npm run test:coverage

      - name: Upload coverage (web-next)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web-next
          path: web-next/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  build-web-next:
    name: web-next · Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck-web-next, test-web-next]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Install
        run: cd web-next && npm ci
      - name: Build
        run: cd web-next && npm run build
        env:
          # Public Supabase env — anon key is safe to commit but cleaner here
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # T4 (regression 2026-09-25: 404 served global-error (500)) — fails
      # loudly on an unrecognised Next build-output shape. Code review
      # 2026-09-27 MUST-FIX 1: this script existed only in package.json and
      # no CI job ever ran it.
      - name: 404 build-artifact check (T4)
        run: cd web-next && npm run verify:404-build

  e2e-web-next:
    name: web-next · Playwright + axe
    runs-on: ubuntu-latest
    needs: [build-web-next]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Install deps
        run: cd web-next && npm ci
      - name: Install Playwright browsers (Chromium)
        run: cd web-next && npx playwright install --with-deps chromium
      - name: Build
        run: cd web-next && npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # T4 — see build-web-next's identical step. Repeated here because this
      # job builds its own separate .next on its own runner.
      - name: 404 build-artifact check (T4)
        run: cd web-next && npm run verify:404-build
      - name: Run E2E (desktop + mobile)
        run: cd web-next && npx playwright test --reporter=list
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-next/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # SonarQube Cloud quality gate (PM decision 2026-10-02: block merges via PRs).
  # Runs on pull requests and on main only (not on feat/** pushes — those get
  # analysed when their PR opens). Runs even when a test job failed
  # (!cancelled()) so the PR still shows the Sonar result next to the red test.
  # CI-based analysis: "Automatic Analysis" must be OFF in SonarCloud.
  # See docs/runbooks/sonarqube-cloud.md.
  # ---------------------------------------------------------------------------
  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [test-typescript, test-shared, test-web-next]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar needs full history for new-code and blame

      # Secrets are not exposed to PRs from forks. Skip only in that case;
      # anywhere else (main, same-repo PR) a missing token is a setup error
      # and must fail loudly.
      - name: Check SONAR_TOKEN
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK_PR" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarQube skipped::PR from a fork: GitHub does not pass secrets to fork PRs, so the quality gate cannot run here. A maintainer must re-run it from a branch in this repo."
          else
            echo "::error title=SONAR_TOKEN missing::Add the repository secret SONAR_TOKEN (Settings > Secrets and variables > Actions). Steps: docs/runbooks/sonarqube-cloud.md"
            exit 1
          fi

      - name: Download coverage reports
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-in

      # vitest writes SF: paths relative to each package (SF:categorize.ts).
      # Sonar resolves them from the repo root, so prefix the package folder.
      - name: Make lcov paths repo-root-relative
        if: steps.token.outputs.present == 'true'
        run: |
          mkdir -p .sonar-coverage
          for pkg in pipeline shared web-next; do
            src="coverage-in/coverage-$pkg/lcov.info"
            if [ -f "$src" ]; then
              sed "s|^SF:|SF:$pkg/|" "$src" > ".sonar-coverage/$pkg.lcov"
              echo "$pkg: $(grep -c '^SF:' ".sonar-coverage/$pkg.lcov") files with coverage"
            else
              echo "::warning title=No coverage for $pkg::$src not found (its test job probably failed before writing coverage)."
            fi
          done

      - name: SonarQube scan + wait for quality gate
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Job turns red when the gate fails (polls up to 5 min).
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
