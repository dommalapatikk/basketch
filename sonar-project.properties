# SonarQube Cloud (sonarcloud.io) analysis config. Read by the `sonarqube` job in
# .github/workflows/ci.yml. See docs/runbooks/sonarqube-cloud.md.

# --- PM MUST CONFIRM these two against the SonarCloud UI -------------------
# Organization key: SonarCloud -> your organization -> Information -> Key.
# Project key:      SonarCloud -> the basketch project -> Information -> Project Key.
# Values below are SonarCloud's import defaults for github.com/dommalapatikk/basketch.
# If the UI shows something different, change them here (the scan fails fast
# with "Project not found" when they are wrong).
sonar.organization=dommalapatikk
sonar.projectKey=dommalapatikk_basketch
# ---------------------------------------------------------------------------

sonar.projectName=basketch
sonar.sourceEncoding=UTF-8

# Analysed code. Python lives under pipeline/ (collection/.../ocr.py) so it is covered.
# SQL is excluded below: SonarCloud would analyse shared/*.sql as Oracle PL/SQL (meaningless findings).
sonar.sources=pipeline,shared,web-next/src

# The same folders are also declared as test roots, so the main set and the test
# set MUST be disjoint or the scan stops with "can't be indexed twice".
# sonar.test.inclusions picks the test files; the SAME patterns are repeated in
# sonar.exclusions below (which applies to main code only) to keep them out of
# the main set. Keep the two lists in sync.
sonar.tests=pipeline,shared,web-next/src,web-next/e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/test_*.py,**/test-support/**,web-next/src/test/**
# Test files that must never be scored (exclusions below do not apply to tests).
sonar.test.exclusions=**/archive/**,**/node_modules/**,**/__fixtures__/**,**/fixtures/**

# Main code only: never analysed. archive/ = retired code (do not modify, do not score).
# Last line = the test patterns from sonar.test.inclusions (keep in sync).
sonar.exclusions=\
  archive/**,\
  pipeline/archive/**,\
  **/node_modules/**,\
  **/__fixtures__/**,\
  **/fixtures/**,\
  **/*.d.ts,\
  **/.next/**,\
  **/coverage/**,\
  **/dist/**,\
  **/*.generated.*,\
  **/.venv/**,\
  **/__pycache__/**,\
  docs/**,\
  **/*.sql,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/test_*.py,\
  **/test-support/**,\
  web-next/src/test/**

# Python version of pipeline/collection/infrastructure/migros/ocr.py (confirm if it targets another).
sonar.python.version=3.12

# Coverage. The CI job writes these files (lcov paths rewritten to be
# repo-root-relative) before the scan. Missing files only produce a warning.
sonar.javascript.lcov.reportPaths=.sonar-coverage/pipeline.lcov,.sonar-coverage/shared.lcov,.sonar-coverage/web-next.lcov

# Python: pipeline/collection/infrastructure/migros/test_ocr.py is NOT run in CI
# today, so there is no Python coverage report. When a pytest job is added, add:
#   sonar.python.coverage.reportPaths=pipeline/coverage.xml
