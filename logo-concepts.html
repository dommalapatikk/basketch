<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>basketch — outline basket</title>
<style>
  :root {
    --ink: #0f172a;
    --ink-2: #475569;
    --paper: #ffffff;
    --page: #f8fafc;
    --line: #e2e8f0;
    --brand: #064e3b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page); color: var(--ink);
    font: 16px/1.5 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lead { color: var(--ink-2); margin: 0 0 36px; font-size: 15px; max-width: 64ch; }

  .gallery {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 16px; padding: 40px;
  }
  .row {
    display: grid; grid-template-columns: 100px 1fr; gap: 28px;
    align-items: center; padding: 24px 0; border-top: 1px solid var(--line);
  }
  .row:first-of-type { border-top: none; padding-top: 0; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
  .pane { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .size-favicon-frame {
    background: var(--page); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px 4px 4px; display: inline-flex; align-items: center;
    gap: 8px; font-size: 12px; color: var(--ink-2);
  }
  .size-favicon-frame svg { width: 32px; height: 32px; }
  .header-mock {
    border: 1px solid var(--line); border-radius: 10px; padding: 14px 20px;
    display: inline-flex; align-items: center; gap: 12px; background: var(--paper);
  }
  .header-mock svg { width: 30px; height: 30px; }
  .header-mock .word { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
  .size-medium { width: 80px; height: 80px; }
  .size-large { width: 160px; height: 160px; }
  .size-xl { width: 240px; height: 240px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>basketch — outline basket · forest emerald</h1>
  <p class="lead">Same classical basket, drawn as line art only — no solid fill on the body. CHF sits inside, solid emerald. One colour: <code style="color:#064e3b">#064e3b</code>.</p>

  <section class="gallery">
    <div class="row">
      <div class="label">Favicon</div>
      <div class="pane">
        <div class="size-favicon-frame">
          <svg viewBox="0 0 64 64"><use href="#mark"/></svg>
          <span>basketch.vercel.app</span>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="label">Header</div>
      <div class="pane">
        <div class="header-mock">
          <svg viewBox="0 0 64 64"><use href="#mark"/></svg>
          <span class="word">basketch</span>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="label">Medium</div>
      <div class="pane">
        <svg class="size-medium" viewBox="0 0 64 64"><use href="#mark"/></svg>
      </div>
    </div>
    <div class="row">
      <div class="label">Large</div>
      <div class="pane">
        <svg class="size-large" viewBox="0 0 64 64"><use href="#mark"/></svg>
      </div>
    </div>
    <div class="row">
      <div class="label">XL</div>
      <div class="pane">
        <svg class="size-xl" viewBox="0 0 64 64"><use href="#mark"/></svg>
      </div>
    </div>
  </section>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark" viewBox="0 0 64 64">
      <!-- Handle: outline -->
      <path d="M 20 24 Q 20 8 32 8 T 44 24"
            fill="none" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Rim: outline (rounded rectangle, stroke only) -->
      <rect x="8" y="22" width="48" height="6" rx="1.2"
            fill="none" stroke="#064e3b" stroke-width="2.5"/>

      <!-- Body: outline (stroke only, no fill) -->
      <path d="M 11 28 L 53 28 L 50 50 Q 50 55 45 55 L 19 55 Q 14 55 14 50 Z"
            fill="none" stroke="#064e3b" stroke-width="3" stroke-linejoin="round"/>

      <!-- CHF solid inside the basket -->
      <text x="32" y="48" text-anchor="middle"
            font-family="'Helvetica Neue', 'Inter', Arial, sans-serif"
            font-weight="900" font-size="18"
            letter-spacing="-1.6"
            fill="#064e3b">CHF</text>
    </symbol>
  </defs>
</svg>

</body>
</html>
